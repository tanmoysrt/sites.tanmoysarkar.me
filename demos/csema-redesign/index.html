function parse() {
  const raw = location.hash.slice(1) || '/';
  const [path, qs] = raw.split('?');
  return { parts: path.split('/').filter(Boolean), query: new URLSearchParams(qs || '') };
}
function go(h) { location.hash = h; }
function setQuery(key, val) {
  const { parts, query } = parse();
  query.set(key, val);
  history.replaceState(null, '', '#/' + parts.join('/') + '?' + query);
}
function section() {
  const p = parse().parts[0] || '';
  return { '': '/', learn: '/learn', practice: '/practice', season: '/practice', compete: '/compete' }[p] || '';
}

const NAV = [['Home', 'house', '/'], ['Learn', 'book-open', '/learn'], ['Practice', 'target', '/practice'], ['Compete', 'trophy', '/compete']];

  $('#bnav').innerHTML = NAV.map(([l, i, to]) =>

}

function render() {
  clearInterval(timer);
  closeLayer();
  const { parts, query } = parse();
  const [a, b, c] = parts;
  let html;
  if (!a) html = home();
  else if (a === 'learn' && c) html = lesson(b, c);
  else if (a === 'learn' && b) html = pathDetail(b);
  else if (a === 'learn') html = learn();
  else if (a === 'practice' && b) html = practiceItem(b);
  else if (a === 'practice') html = practice(query.get('type') || 'challenge');
  else if (a === 'season') html = season();
  else if (a === 'compete') html = compete(query.get('tab') || 'leaderboard');
  else if (a === 'profile') html = profile();
  else if (a === 'plans') html = plans();
  else if (a === 'about') html = about();
  else html = header('<h1>Not found</h1>') + `<div class="wrap w4"><a class="btn" href="#/">Go home</a></div>`;
  $('#main').innerHTML = html;
  $('#main').scrollTop = 0;

function mountMachineClock(id) {
  if (state.machine[id] !== 'running') return;
  const tick = () => {
    const left = Math.max(0, Math.round((machineEnds[id] - Date.now()) / 1000));

  };
  tick();
  timer = setInterval(tick, 1000);
}

    ${items.map(([l, i, h, t]) => `<button role="menuitem" ${h ? `data-href="${h}"` : `data-toast="${t}"`}>${ic(i, 'ink6')}${l}</button>`).join('')}</div>`;
  $('#layer .menu button').focus();
}
function joinTeam() {
  $('#layer').innerHTML = `<div class="overlay" data-close><div class="dialog" role="dialog" aria-modal="true" aria-labelledby="jt" style="max-width:420px;padding:20px">
    <h2 id="jt" class="t-xl semi ink9">Join a team</h2><p class="t-sm p ink6 mt1">Paste the invite code a teammate shared with you.</p>
    <label class="label mt4" for="code">Invite code</label><input class="input" id="code" placeholder="HEX-4821">
    <div class="row g2 mt5" style="justify-content:flex-end"><button class="btn" data-act="close">Cancel</button><button class="btn solid" data-act="join-confirm">Send request</button></div>
  </div></div>`;
  $('#code').focus();
}

/* ---------- Events ---------- */
document.addEventListener('click', (e) => {
  const t = e.target.closest('[data-act],[data-seg],[data-toast],[data-href],[data-close]');
  if (!t) return;
  if (t.dataset.close !== undefined && e.target !== t) return;
  if (t.dataset.close !== undefined) return closeLayer();
  if (t.dataset.href) { closeLayer(); return go(t.dataset.href); }
  if (t.dataset.toast) { closeLayer(); return toast(t.dataset.toast, t.dataset.iconToast || 'info'); }
  if (t.dataset.seg) {
    const v = t.dataset.val, n = t.dataset.seg;
    if (n === 'type') { setQuery('type', v); state.filters.category = ''; }
    if (n === 'tab') setQuery('tab', v);
    if (n === 'track') state.track = v;
    if (n === 'scope') state.scope = v;
    if (n === 'billing') state.billing = v;
    return render();
  }
  const a = t.dataset.act;
  if (a === 'search') openSearch();
  else if (a === 'account') openAccount(t);
  else if (a === 'close') closeLayer();
  else if (a === 'prev') lessonStep(-1);
  else if (a === 'next') lessonStep(1);
  else if (a === 'toggle-upcoming') { state.upcomingOpen = !state.upcomingOpen; render(); }
  else if (a === 'toggle-chapter') { state.seasonOpen = state.seasonOpen === 0 ? -1 : 0; render(); }
  else if (a === 'clear-filters') { state.filters = { q: '', category: '', difficulty: '', free: false }; render(); }
  else if (a === 'copy-link') { navigator.clipboard?.writeText(location.href).catch(() => {}); toast('Link copied'); }
  else if (a === 'start-machine') {
    const id = t.dataset.id;
    state.machine[id] = 'starting'; render();
    setTimeout(() => { state.machine[id] = 'running'; machineEnds[id] = Date.now() + 3600e3; if (parse().parts[1] === id) render(); }, 1600);
  } else if (a === 'stop-machine') { state.machine[t.dataset.id] = 'off'; render(); toast('Machine stopped', 'info'); }
  else if (a === 'submit-flag') {
    const { id, k, xp } = t.dataset;
    const v = $('#flag-' + k).value.trim();
    if (!/^CSEMA\{.+\}$/.test(v)) return toast('Flags look like CSEMA{...}', 'info');
    if (v !== 'CSEMA{demo}') return toast('Not quite. Check spelling and case.', 'info');
    state.solved[id + k] = true; render(); toast(`Correct · +${xp} XP`);
  } else if (a === 'join-team') joinTeam();
  else if (a === 'join-confirm') { closeLayer(); toast('Request sent to the team captain'); }
  else if (a === 'coupon') toast($('#coupon').value ? 'That code is not valid' : 'Enter a code first', 'info');
});

document.addEventListener('keydown', (e) => {
  const typing = /INPUT|SELECT|TEXTAREA/.test(document.activeElement?.tagName);
  if (e.key === 'Escape' && $('#layer').innerHTML) { closeLayer(); return; }
  if (typing) return;
  if (e.key === '/' || (e.key === 'k' && (e.metaKey || e.ctrlKey))) { e.preventDefault(); openSearch(); return; }
  if ($('#layer').innerHTML) return;
  if (e.key === 'ArrowRight') lessonStep(1);
  if (e.key === 'ArrowLeft') lessonStep(-1);
});

function hydrateIcons() {
  document.querySelectorAll('[data-icon]').forEach((el) => { el.innerHTML = ic(el.dataset.icon); el.removeAttribute('data-icon'); });
}

$('#me-av').outerHTML = av(USER.name);
$('#me-av-m').outerHTML = av(USER.name);
$('#me-name').textContent = USER.name;
$('#me-meta').textContent = `Level ${USER.level} · ${USER.xp} XP`;
window.addEventListener('hashchange', render);
render();
</script>
