<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Concept redesign of the CSEMA cybersecurity learning platform on a frappe-ui base: four sections, one next step on Home, card-based practice, and one name per concept. Demo data only.">
<title>CSEMA redesign concept</title>
<link rel="icon" type="image/png" href="brand/csema-mark.png">
<style>
@font-face { font-family: "Inter"; src: url("brand/inter.woff2") format("woff2"); font-weight: 400 700; font-display: swap; }
/* frappe-ui tokens (gray ramp, type scale, radii, shadows) with CSEMA red as the brand accent. */
:root {
  --bg: #ffffff; --sidebar: #f9f9f9; --card: #ffffff;
  --s1: #f9f9f9; --s2: #f4f4f4; --s3: #ededed; --s4: #e4e4e4; --s5: #c9c9c9;
  --ink9: #171717; --ink8: #262626; --ink7: #474747; --ink6: #646464; --ink5: #7b7b7b; --ink4: #a3a3a3;
  --line1: #efefef; --line2: #e6e6e6; --line3: #d6d6d6;
  --brand: #dc2626; --brand-hover: #b91c1c; --brand-soft: #fef2f2; --brand-soft2: #fee2e2; --brand-ink: #b91c1c;
  --green-bg: #e3f7ea; --green-ink: #137547; --amber-bg: #fff3d4; --amber-ink: #9a5800;
  --orange-bg: #ffeddf; --orange-ink: #c2410c; --violet-bg: #efeaff; --violet-ink: #6a43d8; --blue-bg: #e3f1ff; --blue-ink: #0b6bcb;
  --dots: rgba(0, 0, 0, .075); --overlay: rgba(0, 0, 0, .35);
  --shadow-sm: 0 1px 2px rgba(0, 0, 0, .05); --shadow-md: 0 6px 18px rgba(0, 0, 0, .07); --shadow-lg: 0 16px 40px rgba(0, 0, 0, .16);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f0f0f; --sidebar: #141414; --card: #161616;
    --s1: #191919; --s2: #202020; --s3: #292929; --s4: #333333; --s5: #4a4a4a;
    --ink9: #f5f5f5; --ink8: #e6e6e6; --ink7: #c2c2c2; --ink6: #a0a0a0; --ink5: #868686; --ink4: #5f5f5f;
    --line1: #222222; --line2: #2a2a2a; --line3: #3a3a3a;
    --brand: #ef4444; --brand-hover: #dc2626; --brand-soft: rgba(239, 68, 68, .1); --brand-soft2: rgba(239, 68, 68, .18); --brand-ink: #fca5a5;
    --green-bg: #12301f; --green-ink: #5fd18e; --amber-bg: #34280c; --amber-ink: #f1b64a;
    --orange-bg: #3a210f; --orange-ink: #fb923c; --violet-bg: #251d40; --violet-ink: #b39dff; --blue-bg: #0f2a44; --blue-ink: #6fb5ff;
    --dots: rgba(255, 255, 255, .06); --overlay: rgba(0, 0, 0, .6);
    --shadow-sm: 0 1px 2px rgba(0, 0, 0, .4); --shadow-md: 0 6px 18px rgba(0, 0, 0, .45); --shadow-lg: 0 16px 40px rgba(0, 0, 0, .6);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f0f0f; --sidebar: #141414; --card: #161616;
  --s1: #191919; --s2: #202020; --s3: #292929; --s4: #333333; --s5: #4a4a4a;
  --ink9: #f5f5f5; --ink8: #e6e6e6; --ink7: #c2c2c2; --ink6: #a0a0a0; --ink5: #868686; --ink4: #5f5f5f;
  --line1: #222222; --line2: #2a2a2a; --line3: #3a3a3a;
  --brand: #ef4444; --brand-hover: #dc2626; --brand-soft: rgba(239, 68, 68, .1); --brand-soft2: rgba(239, 68, 68, .18); --brand-ink: #fca5a5;
  --green-bg: #12301f; --green-ink: #5fd18e; --amber-bg: #34280c; --amber-ink: #f1b64a;
  --orange-bg: #3a210f; --orange-ink: #fb923c; --violet-bg: #251d40; --violet-ink: #b39dff; --blue-bg: #0f2a44; --blue-ink: #6fb5ff;
  --dots: rgba(255, 255, 255, .06); --overlay: rgba(0, 0, 0, .6);
  --shadow-sm: 0 1px 2px rgba(0, 0, 0, .4); --shadow-md: 0 6px 18px rgba(0, 0, 0, .45); --shadow-lg: 0 16px 40px rgba(0, 0, 0, .6);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  background: var(--bg); color: var(--ink9);
  font: 14px/1.4 "Inter", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  -webkit-font-smoothing: antialiased;
}
a { color: inherit; text-decoration: none; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
p, h1, h2, h3, ul, ol { margin: 0; padding: 0; }
ul, ol { list-style: none; }
:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; border-radius: 6px; }
code, .mono { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; font-size: .92em; }

.i { width: 16px; height: 16px; flex-shrink: 0; display: inline-block; vertical-align: middle; }
.i-sm { width: 14px; height: 14px; } .i-lg { width: 20px; height: 20px; } .i-xl { width: 24px; height: 24px; }

/* Type scale from frappe-ui */
.t-xs { font-size: 12px; } .t-sm { font-size: 13px; } .t-base { font-size: 14px; } .t-lg { font-size: 16px; }
.t-xl { font-size: 17px; } .t-2xl { font-size: 18px; } .t-3xl { font-size: 20px; } .t-4xl { font-size: 24px; }
.p { line-height: 1.55; } .semi { font-weight: 600; } .med { font-weight: 500; }
.t-lg, .t-xl, .t-2xl, .t-3xl, .ph h1, .sec-h h2 { letter-spacing: -0.011em; } .t-4xl { letter-spacing: -0.02em; }
.ink9 { color: var(--ink9); } .ink8 { color: var(--ink8); } .ink7 { color: var(--ink7); } .ink6 { color: var(--ink6); }
.ink5 { color: var(--ink5); } .ink4 { color: var(--ink4); } .brand { color: var(--brand); } .green { color: var(--green-ink); } .amber { color: var(--amber-ink); }
.num { font-variant-numeric: tabular-nums; }
.trunc { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.clamp2 { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.min0 { min-width: 0; } .flex1 { flex: 1; } .shrink0 { flex-shrink: 0; }
.row { display: flex; align-items: center; } .row-s { display: flex; align-items: flex-start; }
.wrapf { flex-wrap: wrap; } .between { justify-content: space-between; }
.g1 { gap: 4px; } .g2 { gap: 8px; } .g3 { gap: 12px; } .g4 { gap: 16px; } .g6 { gap: 24px; }
.mt1 { margin-top: 4px; } .mt2 { margin-top: 8px; } .mt3 { margin-top: 12px; } .mt4 { margin-top: 16px; } .mt5 { margin-top: 20px; } .mt6 { margin-top: 24px; }
.ml-auto { margin-left: auto; } .right { text-align: right; } .center { text-align: center; } .w-full { width: 100%; }
.hide-sm { } .only-sm { display: none; }
@media (max-width: 640px) { .hide-sm { display: none !important; } .only-sm { display: initial; } }

/* Shell */
.app { display: flex; height: 100vh; }
.side { width: 15rem; flex-shrink: 0; background: var(--sidebar); border-right: 1px solid var(--line1); display: flex; flex-direction: column; }
.brandbar { display: flex; align-items: center; padding: 14px 12px 2px; }
.logo { height: 32px; width: auto; display: block; }
.logo-dark { display: none; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .logo-light { display: none; } :root:not([data-theme="light"]) .logo-dark { display: block; } }
:root[data-theme="dark"] .logo-light { display: none; } :root[data-theme="dark"] .logo-dark { display: block; }
.concept { display: block; padding: 0 14px 10px; font-size: 11px; color: var(--ink5); }
.concept:hover { color: var(--ink8); }
.searchbtn {
  margin: 0 10px 10px; height: 30px; display: flex; align-items: center; gap: 8px; padding: 0 10px;
  border: 0; border-radius: 8px; background: var(--s2); color: var(--ink5); font-size: 13px;
}
.searchbtn:hover { background: var(--s3); }
.kbd { margin-left: auto; font-size: 11px; padding: 0 5px; line-height: 18px; border: 1px solid var(--line3); border-radius: 4px; color: var(--ink5); }
.nav { padding: 2px 10px; flex: 1; overflow-y: auto; }
.nav a { display: flex; align-items: center; gap: 10px; height: 32px; padding: 0 10px; border-radius: 8px; color: var(--ink7); font-size: 14px; margin-bottom: 2px; }
.nav a:hover { background: var(--s3); }
.nav a.on { background: var(--card); color: var(--ink9); font-weight: 500; box-shadow: var(--shadow-sm); outline: 1px solid var(--line2); }
.nav a.on .i { color: var(--brand); }
.side-foot { padding: 10px; }
.primebox { padding: 12px; border-radius: 10px; border: 1px solid var(--brand-soft2); background: linear-gradient(160deg, var(--brand-soft), transparent 70%), var(--card); }
.me { width: 100%; display: flex; align-items: center; gap: 10px; margin-top: 10px; padding: 6px; border: 0; border-radius: 8px; background: transparent; text-align: left; }
.me:hover { background: var(--s3); }
.col { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.mtop { display: none; height: 52px; align-items: center; gap: 8px; padding: 0 12px; border-bottom: 1px solid var(--line1); flex-shrink: 0; }
main { flex: 1; min-height: 0; overflow-y: auto; }
.bnav { display: none; }
@media (max-width: 767px) {
  .side { display: none; }
  .mtop { display: flex; }
  main { padding-bottom: 60px; }
  .bnav { display: grid; grid-template-columns: repeat(4, 1fr); position: fixed; inset: auto 0 0 0; height: 60px; z-index: 10; background: var(--bg); border-top: 1px solid var(--line1); }
  .bnav a { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-size: 11px; color: var(--ink5); }
  .bnav a.on { color: var(--brand); font-weight: 500; }
}

/* One page layout everywhere: a 48px header, then a centred body */
.ph { min-height: 48px; display: flex; align-items: center; gap: 10px; padding: 0 20px; border-bottom: 1px solid var(--line1); position: sticky; top: 0; background: var(--bg); z-index: 5; }
@media (max-width: 640px) { .ph { padding: 0 12px; } }
.ph h1 { font-size: 18px; font-weight: 600; }
.crumbs { display: flex; align-items: center; gap: 6px; font-size: 16px; min-width: 0; }
.crumbs a { color: var(--ink5); white-space: nowrap; } .crumbs a:hover { color: var(--ink8); }
.crumbs .sep { color: var(--ink4); }
.crumbs .cur { color: var(--ink9); font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.body { max-width: 1040px; margin: 0 auto; padding: 24px 24px 56px; display: flex; flex-direction: column; gap: 28px; }
.body.narrow { max-width: 1040px; }
@media (max-width: 640px) { .body { padding: 16px 12px 48px; gap: 24px; } }
.sec-h { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 12px; }
.sec-h h2 { font-size: 16px; font-weight: 600; color: var(--ink9); }
.sec-h p { font-size: 13px; color: var(--ink5); margin-top: 2px; }

/* Cards: the one container for everything */
.card { background: var(--card); border: 1px solid var(--line2); border-radius: 12px; box-shadow: var(--shadow-sm); }
.pad { padding: 16px; } .pad-lg { padding: 20px; }
@media (max-width: 640px) { .pad-lg { padding: 16px; } }
a.card { display: flex; flex-direction: column; transition: border-color .15s, box-shadow .15s, transform .15s; }
a.card:hover { border-color: var(--line3); box-shadow: var(--shadow-md); transform: translateY(-1px); }
@media (prefers-reduced-motion: reduce) { a.card, a.card:hover { transition: none; transform: none; } }
.cards { display: grid; gap: 16px; grid-template-columns: repeat(auto-fill, minmax(248px, 1fr)); }
.cards.sm { grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 12px; }
.cards.fit { grid-template-columns: repeat(auto-fit, minmax(248px, 1fr)); }
.grid2 { display: grid; gap: 16px; } @media (min-width: 820px) { .grid2 { grid-template-columns: 1fr 1fr; } }
.grid3 { display: grid; gap: 16px; } @media (min-width: 820px) { .grid3 { grid-template-columns: repeat(3, 1fr); } }

.cover {
  position: relative; height: 104px; display: grid; place-items: center; border-bottom: 1px solid var(--line1); border-radius: 11px 11px 0 0;
  background: radial-gradient(var(--dots) 1px, transparent 1.2px) 0 0 / 14px 14px, var(--s1);
}
.emblem { width: 48px; height: 48px; border-radius: 12px; background: var(--card); border: 1px solid var(--line2); box-shadow: var(--shadow-sm); display: grid; place-items: center; color: var(--ink7); }
.emblem .i { width: 22px; height: 22px; }
.corner { position: absolute; top: 10px; right: 10px; display: flex; gap: 6px; }
.corner-l { position: absolute; top: 10px; left: 10px; }
.tint-brand { color: var(--brand); } .tint-blue { color: var(--blue-ink); } .tint-violet { color: var(--violet-ink); }
.tint-green { color: var(--green-ink); } .tint-orange { color: var(--orange-ink); } .tint-amber { color: var(--amber-ink); } .tint-gray { color: var(--ink7); }
/* Light category tint on covers */
.cover.c-brand { --tint: var(--brand-soft); } .cover.c-blue { --tint: var(--blue-bg); } .cover.c-violet { --tint: var(--violet-bg); }
.cover.c-green { --tint: var(--green-bg); } .cover.c-orange { --tint: var(--orange-bg); } .cover.c-amber { --tint: var(--amber-bg); } .cover.c-gray { --tint: var(--s2); }
.cover[class*="c-"] { background: radial-gradient(var(--dots) 1px, transparent 1.2px) 0 0 / 14px 14px, linear-gradient(135deg, var(--tint), color-mix(in srgb, var(--tint) 35%, var(--s1))); }
.card-body { padding: 14px 16px 16px; display: flex; flex-direction: column; flex: 1; }
.card-foot { margin-top: auto; padding-top: 14px; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.tile { width: 40px; height: 40px; border-radius: 10px; background: var(--s2); display: grid; place-items: center; color: var(--ink6); flex-shrink: 0; }
.tile.brand { background: var(--brand-soft2); color: var(--brand); }

.stats { display: grid; grid-template-columns: repeat(4, 1fr); }
.stats > div { padding: 14px 16px; display: flex; gap: 12px; align-items: center; }
.stats > div + div { border-left: 1px solid var(--line1); }
@media (max-width: 640px) {
  .stats { grid-template-columns: 1fr 1fr; }
  .stats > div + div { border-left: 0; }
  .stats > div:nth-child(2n) { border-left: 1px solid var(--line1); }
  .stats > div:nth-child(n+3) { border-top: 1px solid var(--line1); }
}
.rows > * + * { border-top: 1px solid var(--line1); }
.li { display: flex; align-items: center; gap: 12px; padding: 12px 16px; }
a.li:hover { background: var(--s1); }
.rows > a.li:last-child:hover { border-radius: 0 0 11px 11px; }
.li.cur { background: var(--brand-soft); }

/* Controls (frappe-ui Button, Badge, TabButtons, Switch, inputs) */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 28px; padding: 0 10px;
  border: 1px solid transparent; border-radius: 8px; font-size: 13px; font-weight: 500; white-space: nowrap;
  background: var(--s2); color: var(--ink8); transition: background .12s;
}
.btn:hover { background: var(--s3); }
.btn.solid { background: var(--brand); color: #fff; }
.btn.solid:hover { background: var(--brand-hover); }
.btn.dark { background: var(--ink9); color: var(--bg); } .btn.dark:hover { opacity: .9; }
.btn.outline { background: var(--card); border-color: var(--line3); } .btn.outline:hover { background: var(--s1); }
.btn.ghost { background: transparent; } .btn.ghost:hover { background: var(--s2); }
.btn.ok { background: var(--green-bg); color: var(--green-ink); }
.btn.lg { height: 36px; padding: 0 16px; font-size: 14px; }
.btn.md { height: 32px; padding: 0 12px; }
.btn.icon { width: 28px; padding: 0; } .btn.lg.icon { width: 36px; }
.btn.full { width: 100%; }
.btn.danger { color: var(--brand); }
.btn[disabled] { opacity: .5; cursor: default; }
.btn.soft { background: var(--brand-soft2); color: var(--brand-ink); } .btn.soft:hover { background: var(--brand-soft2); filter: brightness(.97); }
.input { height: 32px; width: 100%; border: 1px solid transparent; border-radius: 8px; background: var(--s2); padding: 0 10px; font-size: 13px; color: var(--ink8); }
.input:hover { background: var(--s3); }
.input:focus { outline: none; background: var(--card); border-color: var(--line3); box-shadow: 0 0 0 3px var(--s3); }
.input::placeholder { color: var(--ink4); }
.inputwrap { position: relative; display: block; } .inputwrap .i { position: absolute; left: 10px; top: 8px; color: var(--ink5); }
.inputwrap .input { padding-left: 32px; }
select.input { appearance: none; padding-right: 28px; background-image: linear-gradient(45deg, transparent 50%, var(--ink5) 50%), linear-gradient(135deg, var(--ink5) 50%, transparent 50%); background-position: calc(100% - 14px) 14px, calc(100% - 10px) 14px; background-size: 4px 4px; background-repeat: no-repeat; }
.label { display: block; font-size: 12px; color: var(--ink6); margin-bottom: 6px; }
.help { font-size: 12px; color: var(--ink5); margin-top: 6px; }
.seg { display: inline-flex; padding: 2px; gap: 2px; border-radius: 9px; background: var(--s2); max-width: 100%; overflow-x: auto; scrollbar-width: none; }
.seg button { border: 0; background: transparent; height: 28px; padding: 0 12px; border-radius: 7px; font-size: 13px; color: var(--ink6); white-space: nowrap; }
.seg button:hover { color: var(--ink9); }
.seg button.on { background: var(--card); color: var(--ink9); font-weight: 500; box-shadow: var(--shadow-sm); }
.seg .cnt { color: var(--ink4); margin-left: 5px; font-weight: 400; }
.sw { position: relative; width: 30px; height: 18px; border-radius: 99px; border: 0; background: var(--s5); padding: 0; flex-shrink: 0; transition: background .15s; }
.sw::after { content: ""; position: absolute; top: 2px; left: 2px; width: 14px; height: 14px; border-radius: 99px; background: #fff; transition: transform .15s; box-shadow: 0 1px 2px rgba(0,0,0,.2); }
.sw[aria-checked="true"] { background: var(--brand); }
.sw[aria-checked="true"]::after { transform: translateX(12px); }
.badge { display: inline-flex; align-items: center; gap: 4px; height: 20px; padding: 0 7px; border-radius: 6px; font-size: 12px; font-weight: 500; white-space: nowrap; background: var(--s3); color: var(--ink7); }
.badge.outline { background: var(--card); box-shadow: inset 0 0 0 1px var(--line3); }
.b-green { background: var(--green-bg); color: var(--green-ink); } .b-amber { background: var(--amber-bg); color: var(--amber-ink); }
.b-orange { background: var(--orange-bg); color: var(--orange-ink); } .b-violet { background: var(--violet-bg); color: var(--violet-ink); }
.b-blue { background: var(--blue-bg); color: var(--blue-ink); } .b-brand { background: var(--brand-soft2); color: var(--brand-ink); }
.b-solid { background: var(--brand); color: #fff; }
.pill { display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 10px; border-radius: 99px; background: var(--s2); font-size: 13px; color: var(--ink8); }
.prog { height: 6px; border-radius: 99px; background: var(--s3); overflow: hidden; }
.prog.thin { height: 4px; }
.prog > div { height: 100%; background: var(--brand); border-radius: 99px; min-width: 4px; transition: width .25s; }
.av { display: inline-grid; place-items: center; border-radius: 99px; background: var(--s3); color: var(--ink7); font-weight: 600; flex-shrink: 0; }
.av-sm { width: 22px; height: 22px; font-size: 11px; } .av-md { width: 30px; height: 30px; font-size: 13px; }
.av-lg { width: 40px; height: 40px; font-size: 15px; } .av-xl { width: 64px; height: 64px; font-size: 24px; }
.av.brand { background: var(--brand-soft2); color: var(--brand-ink); }
.dot { width: 8px; height: 8px; border-radius: 99px; background: var(--s5); flex-shrink: 0; }
.dot.amber { background: #e79913; } .dot.green { background: #30a66d; box-shadow: 0 0 0 4px var(--green-bg); }
.skel { background: var(--s2); border-radius: 6px; animation: pulse 1.2s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: .5; } }
@media (prefers-reduced-motion: reduce) { .skel { animation: none; } .prog > div, .sw, .sw::after { transition: none; } }

/* Home hero, season banner, podium, heatmap, slides */
.hero { position: relative; overflow: hidden; }
.hero .row-s > .min0.flex1 { flex: 1 1 320px; }
@media (max-width: 640px) { .hero .row-s > .tile { display: none; } .hero .row-s > .btn, .hero .row-s > .row { width: 100%; } .hero .row-s > .row > .btn { flex: 1; } }
.hero::before { content: ""; position: absolute; inset: 0 0 auto 0; height: 3px; background: linear-gradient(90deg, #dc2626, #ef4444); }
.banner { background: linear-gradient(100deg, var(--brand-soft) 0%, transparent 60%), var(--card); border-color: var(--brand-soft2); }
.podium { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; align-items: end; }
.podium .card { text-align: center; padding: 16px 12px; }
.podium .first { padding-top: 24px; border-color: var(--brand-soft2); background: linear-gradient(180deg, var(--brand-soft), transparent 70%), var(--card); }
.rank { display: inline-grid; place-items: center; width: 22px; height: 22px; border-radius: 99px; font-size: 12px; font-weight: 600; background: var(--s3); color: var(--ink7); }
.rank.r1 { background: var(--brand); color: #fff; }

.empty { display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 40px 16px; text-align: center; }
.empty .circ { width: 48px; height: 48px; border-radius: 99px; background: var(--s2); display: grid; place-items: center; color: var(--ink5); margin-bottom: 4px; }
.feat li { display: flex; gap: 8px; font-size: 13px; line-height: 1.5; color: var(--ink7); }
.feat li + li { margin-top: 10px; }
.feat .i { margin-top: 2px; color: var(--green-ink); }
.honours { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }

.honours > div.off { opacity: .45; }

function parse() {

}
const go = (h) => { location.hash = h; };
function setQuery(key, val) {
  const { parts, query } = parse();
  query.set(key, val);
  history.replaceState(null, '', '#/' + parts.join('/') + '?' + query);
}
function section() {
  const p = parse().parts[0] || '';
  return { '': '/', learn: '/learn', practice: '/practice', season: '/practice', compete: '/compete' }[p] || '';
}

function lessonStep(dir) {
  const { parts } = parse();
  if (parts[0] !== 'learn' || !parts[2]) return;
  if (dir < 0) { if (state.slide > 0) { state.slide--; render(); } return; }
  if (state.slide < SLIDES.length - 1) { state.slide++; render(); return; }
  const idx = FLAT.findIndex((l) => l.id === parts[2]);
  toast(`Lesson complete · +${FLAT[idx].xp} XP`);
  const nx = FLAT[idx + 1];
  if (nx) go(`#/learn/${parts[1]}/${nx.id}`);
}

function mountPractice() {

    hydrateIcons();
  };
  $('#f-q').oninput = (e) => { f.q = e.target.value; draw(); };

        <p class="t-base semi ink9 mt3 trunc">${n}</p><p class="t-xs ink5 mt1">${mem} members · ${fmt.format(xp)} XP</p></div>`).join('')}</div>`)}`;
  } else {
    body = `<p class="t-sm ink6">Events use your CSEMA account.</p>
    <div class="cards">${EVENTS.map((e) => `<div class="card pad" style="display:flex;flex-direction:column;gap:12px">
        <div class="row g3"><div class="calbox"><span class="t-xs semi">${fmtDate(e.date, { month: 'short' })}</span><span class="t-3xl semi">${fmtDate(e.date, { day: 'numeric' })}</span></div>
          <div class="min0"><p class="t-base semi ink9">${e.title}</p><p class="t-xs ink5 mt1">${e.duration}</p></div></div>
        <p class="t-sm ink6">${e.format}</p>
        <div class="row between" style="margin-top:auto">${badge(e.status, e.open ? 'green' : '')}<button class="btn md ${e.open ? 'solid' : 'outline'}" data-toast="${e.open ? 'You are registered (demo)' : 'We will remind you (demo)'}">${e.open ? 'Register' : 'Remind me'}</button></div>
      </div>`).join('')}</div>`;
  }
  return page('<h1>Compete</h1>', `<div>${tabs}</div>${body}`, 'narrow');
}

function heatmap() {
  const weeks = 26, cells = [];
  const today = new Date(); const dow = (today.getDay() + 6) % 7;
  const total = weeks * 7 - (6 - dow);
  for (let i = 0; i < weeks * 7; i++) {
    const daysAgo = total - 1 - i;
    let lvl = '';
    if (daysAgo === 2) lvl = 'l2'; else if (daysAgo === 3) lvl = 'l1';
    cells.push(i < total ? `<i class="${lvl}" title="${daysAgo === 0 ? 'Today' : daysAgo + ' days ago'}"></i>` : '<i style="visibility:hidden"></i>');
  }
  return `<div class="heat" role="img" aria-label="Activity over the last 26 weeks: 2 active days">${cells.join('')}</div>`;
}

/* ---------- Overlays ---------- */
const closeLayer = () => { $('#layer').innerHTML = ''; };
function openSearch() {
  $('#layer').innerHTML = `<div class="overlay" data-close><div class="dialog" role="dialog" aria-modal="true" aria-label="Search">
    <label class="row g3" style="padding:0 16px;border-bottom:1px solid var(--line1)">${ic('search', 'ink5')}<input id="sq" placeholder="Search lessons, challenges, machines, labs" aria-label="Search" autocomplete="off" style="flex:1;height:52px;border:0;background:transparent;font-size:15px;outline:none"><span class="kbd">Esc</span></label>
    <div id="sres" style="max-height:60vh;overflow-y:auto;padding:8px"></div></div></div>`;
  const draw = () => {
    const q = $('#sq').value.trim().toLowerCase();
    if (!q) { $('#sres').innerHTML = `<p class="t-sm ink5 center" style="padding:24px 8px">Try “sql”, “forensics” or “osi”.</p>`; return; }
    const hit = (s) => s.toLowerCase().includes(q);
    const learnRows = [...PATHS.filter((p) => hit(p.title)).map((p) => [p.title, 'Path · ' + p.track, p.icon, `#/learn/${p.id}`]),
      ...FLAT.filter((l) => hit(l.title)).map((l) => [l.title, 'Lesson · Networking deep dive, part 1', 'book-open', `#/learn/networking-1/${l.id}`])].slice(0, 5);
    const pr = ITEMS.filter((i) => hit(i.title) || hit(i.category)).slice(0, 6)
      .map((i) => [i.title, `${TYPE[i.type].label} · ${i.category} · ${i.difficulty}`, (CATEGORY[i.category] || [TYPE[i.type].icon])[0], `#/practice/${i.id}`]);
    const groups = [['Learn', learnRows], ['Practice', pr]].filter(([, r]) => r.length);
    $('#sres').innerHTML = groups.length ? groups.map(([g, rows]) => `<p class="t-xs ink5" style="padding:6px 10px">${g}</p>${rows.map(([t, m, i, h]) =>
      `<a class="res" href="${h}"><span class="tile" style="width:32px;height:32px">${ic(i, 'i-sm')}</span><span class="min0 flex1"><span class="t-base med ink9 trunc" style="display:block">${esc(t)}</span><span class="t-xs ink5 trunc" style="display:block">${esc(m)}</span></span></a>`).join('')}`).join('')
      : `<p class="t-sm ink5 center" style="padding:24px 8px">No results for “${esc(q)}”.</p>`;
  };
  $('#sq').oninput = draw;
  $('#sq').onkeydown = (e) => { if (e.key === 'Enter') { const a = $('#sres a'); if (a) go(a.getAttribute('href')); } };
  draw();
  $('#sq').focus();
}
function openAccount(anchor) {
  const r = anchor.getBoundingClientRect();
  const below = r.top < window.innerHeight / 2;
  const items = [['Profile', 'user', '#/profile'], ['Plans and billing', 'credit-card', '#/plans'], ['About this concept', 'info', '#/about'], null,
    ['Become an ambassador', 'megaphone', null, 'The ambassador form opens here'], ['Sign out', 'log-out', null, 'Signed out (demo)']];
  $('#layer').innerHTML = `<div style="position:fixed;inset:0;z-index:29" data-close></div>
    <div class="menu" role="menu" style="${below ? `top:${r.bottom + 6}px;right:${Math.max(8, window.innerWidth - r.right)}px` : `bottom:${window.innerHeight - r.top + 6}px;left:${r.left}px`}">
    ${items.map((x) => x ? `<button role="menuitem" ${x[2] ? `data-href="${x[2]}"` : `data-toast="${x[3]}"`}><span class="ink6">${ic(x[1])}</span>${x[0]}</button>` : '<hr>').join('')}</div>`;
  $('#layer .menu button').focus();
}
function joinTeam() {
  $('#layer').innerHTML = `<div class="overlay" data-close><div class="dialog" role="dialog" aria-modal="true" aria-labelledby="jt" style="max-width:420px;padding:20px">
    <h2 id="jt" class="t-xl semi ink9">Join a team</h2><p class="t-sm p ink6 mt1">Type the code from your team captain.</p>

}

/* ---------- Events ---------- */
document.addEventListener('click', (e) => {
  const t = e.target.closest('[data-act],[data-seg],[data-toast],[data-href],[data-close]');
  if (!t) return;
  if (t.dataset.close !== undefined) { if (e.target === t) closeLayer(); return; }
  if (t.dataset.href) { closeLayer(); return go(t.dataset.href); }
  if (t.dataset.toast) { closeLayer(); return toast(t.dataset.toast, t.dataset.toastIcon || 'info'); }
  if (t.dataset.seg) {
    const v = t.dataset.val, n = t.dataset.seg;
    if (n === 'type') { setQuery('type', v); state.filters.category = ''; }
    if (n === 'tab') setQuery('tab', v);
    if (n === 'track') state.track = v;
    if (n === 'scope') state.scope = v;
    if (n === 'billing') state.billing = v;
    return render();
  }
  const a = t.dataset.act;
  if (a === 'search') openSearch();
  else if (a === 'account') openAccount(t);
  else if (a === 'close') closeLayer();
  else if (a === 'prev') lessonStep(-1);
  else if (a === 'next') lessonStep(1);
  else if (a === 'answer') {
    const v = ($('#qa').value || '').trim().toLowerCase();
    if (!v) return toast('Type an answer.', 'info');
    if (v.replace(/^a /, '') !== QUESTION.answer) return toast('Incorrect. Read slide 3 again.', 'info');
    state.answered = true; render(); toast(`Correct · +${QUESTION.xp} XP`);
  }
  else if (a === 'toggle-upcoming') { state.upcomingOpen = !state.upcomingOpen; render(); }
  else if (a === 'clear-filters') { state.filters = { q: '', category: '', difficulty: '', free: false }; render(); }
  else if (a === 'copy-link') { navigator.clipboard?.writeText(location.href).catch(() => {}); toast('Link copied'); }
  else if (a === 'start-machine') {
    const id = t.dataset.id;
    state.machine[id] = 'starting'; render();
    setTimeout(() => { state.machine[id] = 'running'; machineEnds[id] = Date.now() + 3600e3; if (parse().parts[1] === id) render(); toast('Machine is running'); }, 1600);
  } else if (a === 'stop-machine') { state.machine[t.dataset.id] = 'off'; render(); toast('Machine stopped', 'info'); }
  else if (a === 'submit-flag') {
    const { id, k, xp } = t.dataset;
    const v = $('#flag-' + k).value.trim();
    if (!/^CSEMA\{.+\}$/.test(v)) return toast('Use the format CSEMA{...}.', 'info');
    if (v !== 'CSEMA{demo}') return toast('Incorrect flag. Check the spelling and the case.', 'info');
    state.solved[id + k] = true; render(); toast(`Correct · +${xp} XP`);
  } else if (a === 'join-team') joinTeam();
  else if (a === 'join-confirm') { closeLayer(); toast('Request sent to the team captain'); }
  else if (a === 'coupon') toast($('#coupon').value ? 'This code is not valid.' : 'Type a code.', 'info');
});

document.addEventListener('keydown', (e) => {
  const typing = /INPUT|SELECT|TEXTAREA/.test(document.activeElement?.tagName);
  if (e.key === 'Escape' && $('#layer').innerHTML) { closeLayer(); return; }
  if (e.key === 'Enter' && document.activeElement?.id === 'qa') { $('[data-act="answer"]')?.click(); return; }
  if (typing) return;
  if (e.key === '/' || (e.key === 'k' && (e.metaKey || e.ctrlKey))) { e.preventDefault(); openSearch(); return; }
  if ($('#layer').innerHTML) return;
  if (e.key === 'ArrowRight') lessonStep(1);
  if (e.key === 'ArrowLeft') lessonStep(-1);
});

function hydrateIcons() {
  document.querySelectorAll('[data-icon]').forEach((el) => { el.outerHTML = ic(el.dataset.icon, el.className); });
}

$('#me-av').outerHTML = av(USER.name, 'md', 'brand');
$('#me-av-m').outerHTML = av(USER.name, 'md', 'brand');
$('#me-name').textContent = USER.name;
$('#me-meta').innerHTML = `<span class="row g1">${ic('flame', 'i-sm brand')}${USER.streak}</span><span class="row g1">${ic('zap', 'i-sm amber')}${USER.xp} XP</span><span>Level ${USER.level}</span>`;
window.addEventListener('hashchange', render);
render();
</script>
