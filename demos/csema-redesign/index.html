<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Concept redesign of the CSEMA cybersecurity learning platform: four sections, one next step on Home, one practice catalog, and one name per concept. Demo data only.">
<title>CSEMA redesign concept</title>
<style>
@font-face { font-family: "Archivo"; src: url("fonts/archivo.woff2") format("woff2"); font-weight: 100 900; font-stretch: 62% 125%; font-display: swap; }
@font-face { font-family: "JetBrains Mono"; src: url("fonts/jetbrains-mono.woff2") format("woff2"); font-weight: 400 600; font-display: swap; }

/* Navy ink on cool lab paper. Signal red marks the primary action and "you are here", nothing else. */
:root {
  --page: #eef1f4; --panel: #ffffff; --hover: #e3e8ee;
  --ink: #0e1a2b; --ink-2: #364559; --ink-3: #627286; --ink-4: #95a1b1;
  --rule: #d8dee6; --rule-2: #bcc6d2;
  --signal: #d7263d; --signal-ink: #ffffff; --signal-soft: #f8dde1;
  --ok: #1d7a52; --scrim: rgba(14, 26, 43, .45);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --page: #0c1626; --panel: #122036; --hover: #1a2b45;
    --ink: #e8edf3; --ink-2: #b9c4d1; --ink-3: #8696aa; --ink-4: #5b6b81;
    --rule: #20304a; --rule-2: #31445f;
    --signal: #f04a5e; --signal-soft: #3b1b27; --ok: #4cc38a; --scrim: rgba(3, 8, 16, .65);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --page: #0c1626; --panel: #122036; --hover: #1a2b45;
  --ink: #e8edf3; --ink-2: #b9c4d1; --ink-3: #8696aa; --ink-4: #5b6b81;
  --rule: #20304a; --rule-2: #31445f;
  --signal: #f04a5e; --signal-soft: #3b1b27; --ok: #4cc38a; --scrim: rgba(3, 8, 16, .65);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  background: var(--page); color: var(--ink);
  font-family: "Archivo", ui-sans-serif, system-ui, sans-serif; font-size: 15px; line-height: 1.5; font-stretch: 100%;
  -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility;
}
a { color: inherit; text-decoration: none; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
p, h1, h2, h3, ol, ul, dl, dd { margin: 0; padding: 0; }
ol, ul { list-style: none; }
:focus-visible { outline: 2px solid var(--signal); outline-offset: 2px; border-radius: 4px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* Type. Condensed Archivo carries headings; body stays at normal width. */
.display { font-stretch: 72%; font-weight: 760; letter-spacing: -0.005em; line-height: .96; }
.d-hero { font-size: clamp(44px, 7vw, 76px); }
.d-1 { font-size: clamp(36px, 5vw, 48px); }
.d-2 { font-size: 26px; line-height: 1.05; }
.d-3 { font-size: 21px; line-height: 1.1; }
.lead { font-size: 17px; line-height: 1.55; color: var(--ink-2); max-width: 60ch; }
.body { font-size: 15px; line-height: 1.55; color: var(--ink-2); }
.small { font-size: 13px; } .tiny { font-size: 12px; }
.c2 { color: var(--ink-2); } .c3 { color: var(--ink-3); } .c4 { color: var(--ink-4); } .ok { color: var(--ok); }
.strong { font-weight: 600; color: var(--ink); }
.mono { font-family: "JetBrains Mono", ui-monospace, monospace; font-size: .92em; }
.num { font-variant-numeric: tabular-nums; }
.trunc { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.clamp2 { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }

/* Layout helpers */
.row { display: flex; align-items: center; } .top { align-items: flex-start; } .wrap { flex-wrap: wrap; }
.gap-1 { gap: 6px; } .gap-2 { gap: 10px; } .gap-3 { gap: 16px; } .gap-4 { gap: 24px; } .gap-5 { gap: 40px; }
.grow { flex: 1; min-width: 0; } .push { margin-left: auto; } .shrink0 { flex-shrink: 0; }
.mt-1 { margin-top: 6px; } .mt-2 { margin-top: 12px; } .mt-3 { margin-top: 20px; } .mt-4 { margin-top: 32px; } .mt-5 { margin-top: 56px; }
.metas { display: flex; flex-wrap: wrap; gap: 6px 18px; font-size: 13px; color: var(--ink-3); }
.metas span { display: inline-flex; align-items: center; gap: 5px; }
.hide-m { } .only-m { display: none; }
@media (max-width: 720px) { .hide-m { display: none !important; } .only-m { display: inline; } }

.i { width: 16px; height: 16px; flex-shrink: 0; display: inline-block; vertical-align: -3px; }
.i-s { width: 14px; height: 14px; } .i-l { width: 20px; height: 20px; }

/* Shell: a rail of large condensed words, the content set flush left beside it. */
.app { display: grid; grid-template-columns: 236px minmax(0, 1fr); height: 100vh; }
.rail { display: flex; flex-direction: column; border-right: 1px solid var(--rule); padding: 24px 20px 16px; overflow-y: auto; }
.mark { display: flex; align-items: center; gap: 9px; font-stretch: 72%; font-weight: 800; font-size: 24px; letter-spacing: .01em; }
.mark .hex { width: 22px; height: 22px; color: var(--signal); }
.concept { display: block; margin-top: 6px; font-size: 12px; color: var(--ink-3); text-decoration: underline; text-decoration-color: var(--rule-2); text-underline-offset: 3px; }
.findbox {
  margin-top: 24px; display: flex; align-items: center; gap: 8px; height: 36px; padding: 0 10px; width: 100%;
  border: 1px solid var(--rule-2); border-radius: 6px; background: var(--panel); color: var(--ink-3); font-size: 14px; text-align: left;
}
.findbox:hover { border-color: var(--ink-3); }
.key { margin-left: auto; font-size: 11px; line-height: 1; padding: 3px 6px; border: 1px solid var(--rule-2); border-radius: 4px; color: var(--ink-3); }
.nav { margin-top: 28px; display: flex; flex-direction: column; gap: 2px; }
.nav a { position: relative; display: flex; align-items: center; height: 40px; padding-left: 22px; font-stretch: 72%; font-weight: 680; font-size: 26px; color: var(--ink-4); }
.nav a:hover { color: var(--ink-2); }
.nav a.on { color: var(--ink); }
.nav a.on::before { content: ""; position: absolute; left: 2px; top: 50%; width: 10px; height: 10px; margin-top: -5px; border-radius: 50%; background: var(--signal); box-shadow: 0 0 0 4px var(--signal-soft); }
.planbox { margin-top: auto; padding-top: 16px; border-top: 1px solid var(--rule); font-size: 13px; color: var(--ink-2); line-height: 1.5; }
.planbox a { color: var(--ink); text-decoration: underline; text-underline-offset: 3px; text-decoration-color: var(--rule-2); }
.me { margin-top: 16px; width: 100%; display: flex; align-items: center; gap: 10px; padding: 6px; border: 0; border-radius: 6px; background: transparent; text-align: left; }
.me:hover { background: var(--hover); }
.av { display: inline-grid; place-items: center; width: 32px; height: 32px; border-radius: 50%; border: 1px solid var(--rule-2); background: var(--panel); font-weight: 600; font-size: 13px; color: var(--ink-2); flex-shrink: 0; }
.av.s { width: 24px; height: 24px; font-size: 11px; } .av.l { width: 64px; height: 64px; font-size: 26px; font-stretch: 72%; font-weight: 760; }

main { overflow-y: auto; min-width: 0; }
.page { max-width: 1080px; padding: 40px 56px 96px; }
.page.narrow { max-width: 860px; }
@media (max-width: 1100px) { .page { padding: 32px 32px 96px; } }
.crumb { display: flex; flex-wrap: wrap; gap: 6px; font-size: 13px; color: var(--ink-3); margin-bottom: 14px; }
.crumb a { text-decoration: underline; text-decoration-color: var(--rule-2); text-underline-offset: 3px; }
.crumb a:hover { color: var(--ink); }
.crumb .sep { color: var(--ink-4); }

.mtop, .bnav { display: none; }
@media (max-width: 860px) {
  .app { grid-template-columns: 1fr; grid-template-rows: auto 1fr; }
  .rail { display: none; }
  .mtop { display: flex; align-items: center; gap: 10px; height: 52px; padding: 0 16px; border-bottom: 1px solid var(--rule); }
  .mtop .mark { font-size: 21px; }
  .page { padding: 24px 16px 104px; }
  .bnav { display: grid; grid-template-columns: repeat(4, 1fr); position: fixed; left: 0; right: 0; bottom: 0; height: 60px; z-index: 10; background: var(--page); border-top: 1px solid var(--rule); }
  .bnav a { position: relative; display: grid; place-items: center; font-stretch: 72%; font-weight: 680; font-size: 18px; color: var(--ink-4); }
  .bnav a.on { color: var(--ink); }
  .bnav a.on::after { content: ""; position: absolute; top: -1px; left: 30%; right: 30%; height: 3px; background: var(--signal); border-radius: 0 0 3px 3px; }
}

/* Controls */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 7px; height: 36px; padding: 0 14px;
  border: 1px solid var(--rule-2); border-radius: 6px; background: var(--panel); color: var(--ink); font-size: 14px; font-weight: 520; white-space: nowrap;
}
.btn:hover { border-color: var(--ink-3); }
.btn.primary { background: var(--signal); border-color: var(--signal); color: var(--signal-ink); font-weight: 600; }
.btn.primary:hover { filter: brightness(1.06); }
.btn.quiet { border-color: transparent; background: transparent; color: var(--ink-2); }
.btn.quiet:hover { background: var(--hover); }
.btn.big { height: 46px; padding: 0 22px; font-size: 16px; }
.btn.sq { width: 36px; padding: 0; }
.btn.done { background: transparent; border-color: var(--ok); color: var(--ok); }
.btn[disabled] { opacity: .45; cursor: default; filter: none; }
.btn.danger { color: var(--signal); }
.field {
  height: 36px; width: 100%; padding: 0 10px; border: 1px solid var(--rule-2); border-radius: 6px; background: var(--panel); color: var(--ink); font-size: 14px;
}
.field::placeholder { color: var(--ink-4); }
.field:focus { outline: none; border-color: var(--ink-2); box-shadow: 0 0 0 3px var(--hover); }
.field.mono { font-family: "JetBrains Mono", ui-monospace, monospace; font-size: 13px; }
select.field { appearance: none; padding-right: 30px; background-image: linear-gradient(45deg, transparent 50%, var(--ink-3) 50%), linear-gradient(135deg, var(--ink-3) 50%, transparent 50%); background-position: calc(100% - 15px) 16px, calc(100% - 10px) 16px; background-size: 5px 5px; background-repeat: no-repeat; }
.withicon { position: relative; display: block; } .withicon .i { position: absolute; left: 11px; top: 10px; color: var(--ink-3); } .withicon .field { padding-left: 34px; }
.flabel { display: block; font-size: 14px; font-weight: 600; margin-bottom: 6px; }
.fhelp { font-size: 13px; color: var(--ink-3); margin-top: 6px; }
.toggle { display: inline-flex; align-items: center; gap: 9px; border: 0; background: transparent; padding: 0; font-size: 14px; color: var(--ink-2); }
.toggle .track { position: relative; width: 32px; height: 18px; border-radius: 99px; background: var(--rule-2); transition: background .15s; }
.toggle .track::after { content: ""; position: absolute; left: 2px; top: 2px; width: 14px; height: 14px; border-radius: 50%; background: var(--panel); transition: transform .15s; }
.toggle[aria-checked="true"] .track { background: var(--ink); }
.toggle[aria-checked="true"] .track::after { transform: translateX(14px); }

/* Text tabs with an ink underline */
.tabs { display: flex; gap: 26px; border-bottom: 1px solid var(--rule); overflow-x: auto; scrollbar-width: none; }
.tabs button { position: relative; flex-shrink: 0; border: 0; background: transparent; padding: 0 0 12px; font-size: 16px; font-weight: 560; color: var(--ink-3); }
.tabs button:hover { color: var(--ink); }
.tabs button.on { color: var(--ink); }
.tabs button.on::after { content: ""; position: absolute; left: 0; right: 0; bottom: -1px; height: 2px; background: var(--ink); }
.tabs .n { margin-left: 6px; font-size: 13px; color: var(--ink-4); font-weight: 500; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chips button { height: 32px; padding: 0 13px; border: 1px solid var(--rule-2); border-radius: 99px; background: transparent; font-size: 14px; color: var(--ink-2); }
.chips button:hover { border-color: var(--ink-3); }
.chips button.on { background: var(--ink); border-color: var(--ink); color: var(--page); }

/* Bars */
.bar { height: 3px; border-radius: 3px; background: var(--rule); overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--ink); min-width: 3px; border-radius: 3px; transition: width .25s; }

/* Difficulty as a four-step signal meter */
.meter { display: inline-flex; align-items: center; gap: 7px; font-size: 13px; color: var(--ink-2); }
.meter .pips { display: inline-flex; align-items: flex-end; gap: 2px; height: 12px; }
.meter i { width: 3px; border-radius: 1px; background: var(--rule-2); }
.meter i:nth-child(1) { height: 5px; } .meter i:nth-child(2) { height: 7px; } .meter i:nth-child(3) { height: 10px; } .meter i:nth-child(4) { height: 12px; }
.meter i.on { background: var(--ink); }
.meter.expert i.on { background: var(--signal); }

/* The signature: learning drawn as a network route. Filled = done, red = you are here, hollow = ahead. */
.node { display: block; width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--rule-2); background: var(--page); flex-shrink: 0; position: relative; z-index: 1; }
.done > .node, .done .node { background: var(--ink); border-color: var(--ink); }
.here > .node, .here .node { background: var(--signal); border-color: var(--signal); box-shadow: 0 0 0 5px var(--signal-soft); animation: ping 2.4s ease-out infinite; }
.locked .node { border-style: dashed; }
@keyframes ping { 0% { box-shadow: 0 0 0 0 var(--signal-soft); } 60% { box-shadow: 0 0 0 9px transparent; } 100% { box-shadow: 0 0 0 5px var(--signal-soft); } }
@media (prefers-reduced-motion: reduce) { .here .node, .here > .node { animation: none; } .bar > i, .toggle .track, .toggle .track::after { transition: none; } }

.route { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); }
.route li { position: relative; padding-right: 14px; }
.route li::after { content: ""; position: absolute; left: 14px; right: 0; top: 6px; height: 2px; background: var(--rule-2); }
.route li.done::after { background: var(--ink); }
.route li:last-child::after { display: none; }
.route a { display: block; }
.route .lbl { display: block; margin-top: 10px; font-size: 13px; line-height: 1.35; color: var(--ink-3); }
.route .here .lbl { color: var(--ink); font-weight: 600; }
.route .done .lbl { color: var(--ink-2); }
.route a:hover .lbl { color: var(--ink); text-decoration: underline; text-underline-offset: 3px; text-decoration-color: var(--rule-2); }
@media (max-width: 720px) {
  .route { grid-auto-flow: row; gap: 0; }
  .route li { padding: 0 0 14px 28px; }
  .route li::after { left: 6px; right: auto; top: 14px; bottom: 0; width: 2px; height: auto; }
  .route .node { position: absolute; left: 0; top: 2px; }
  .route .lbl { margin-top: 0; }
}

.vroute > li { position: relative; }
.vroute > li::before { content: ""; position: absolute; left: 6px; top: 0; bottom: 0; width: 2px; background: var(--rule-2); }
.vroute > li.done::before { background: var(--ink); }
.vroute > li:first-child::before { top: 24px; }
.vroute > li:last-child::before { bottom: calc(100% - 24px); }
.vroute > li:only-child::before { display: none; }
.vroute .stop { display: flex; align-items: flex-start; gap: 18px; padding: 14px 8px 14px 0; border-radius: 6px; }
.vroute .stop .node { margin-top: 3px; }
a.stop:hover .t, button.stop:hover .t { text-decoration: underline; text-underline-offset: 3px; text-decoration-color: var(--rule-2); }
.vroute .t { font-size: 16px; font-weight: 600; color: var(--ink); }
.vroute .done .t { color: var(--ink-2); font-weight: 500; }
.vroute .d { font-size: 14px; color: var(--ink-3); margin-top: 2px; }
.vroute .side { margin-left: auto; padding-left: 16px; text-align: right; font-size: 13px; color: var(--ink-3); white-space: nowrap; }
.here-tag { display: inline-block; margin-left: 8px; font-size: 12px; font-weight: 600; color: var(--signal); vertical-align: 1px; }

/* Ruled lists and tables */
.ruled > * { border-top: 1px solid var(--rule); }
.ruled > *:last-child { border-bottom: 1px solid var(--rule); }
.rowlink { display: flex; align-items: center; gap: 16px; padding: 14px 4px; }
a.rowlink:hover .t { text-decoration: underline; text-underline-offset: 3px; text-decoration-color: var(--rule-2); }
.rowlink .t { font-size: 16px; font-weight: 600; }
.table { width: 100%; }
.tr { display: grid; grid-template-columns: minmax(0, 1fr) 7.5rem 4.5rem 4.5rem 7rem; gap: 16px; align-items: center; padding: 13px 4px; border-bottom: 1px solid var(--rule); }
.tr.th { padding: 0 4px 10px; font-size: 13px; color: var(--ink-3); border-bottom-color: var(--rule-2); }
a.tr:hover { background: var(--hover); }
a.tr:hover .t { text-decoration: underline; text-underline-offset: 3px; text-decoration-color: var(--rule-2); }
.tr .t { font-size: 15px; font-weight: 600; }
.tr .r { text-align: right; }
.lb .tr { grid-template-columns: 3rem minmax(0, 1fr) 6rem 7rem; }
.lb .tr.you { background: var(--signal-soft); border-radius: 6px; }
@media (max-width: 720px) {
  .tr { grid-template-columns: minmax(0, 1fr) auto; }
  .tr .w { display: none; }
  .lb .tr { grid-template-columns: 2.4rem minmax(0, 1fr) auto; }
}

/* Panels: used only where grouping matters */
.panel { background: var(--panel); border: 1px solid var(--rule); border-radius: 10px; padding: 20px; }
.split { display: grid; grid-template-columns: 1fr 1fr; gap: 40px; }
@media (max-width: 860px) { .split { grid-template-columns: 1fr; gap: 32px; } }
.hr { border: 0; border-top: 1px solid var(--rule); margin: 40px 0; }
.sentence { font-size: 19px; line-height: 1.55; color: var(--ink-2); max-width: 62ch; }
.sentence b { font-stretch: 72%; font-weight: 760; font-size: 24px; color: var(--ink); letter-spacing: -.005em; }

/* Redaction: locked content shows its shape, not its contents */
.redact { border: 1px solid var(--rule); border-radius: 10px; padding: 22px; background: var(--panel); }
.redact .lines { display: flex; flex-direction: column; gap: 9px; margin: 16px 0 18px; }
.redact .lines span { display: block; height: 12px; border-radius: 2px; background: var(--ink); opacity: .88; }

.dot { width: 9px; height: 9px; border-radius: 50%; background: var(--ink-4); flex-shrink: 0; }
.dot.wait { background: #c98a12; } .dot.live { background: var(--ok); box-shadow: 0 0 0 4px color-mix(in srgb, var(--ok) 20%, transparent); }

.slide { aspect-ratio: 16 / 9; display: flex; flex-direction: column; justify-content: flex-end; padding: 40px 44px; background: var(--panel); border: 1px solid var(--rule); border-radius: 10px; }
@media (max-width: 720px) { .slide { aspect-ratio: auto; min-height: 300px; padding: 24px; } }
.lessonwrap { display: grid; grid-template-columns: minmax(0, 1fr) 280px; gap: 48px; }
@media (max-width: 1100px) { .lessonwrap { grid-template-columns: 1fr; } .lessonwrap aside { display: none; } }

.plans { display: grid; grid-template-columns: repeat(3, 1fr); border-top: 1px solid var(--rule); }
.plans > div { padding: 24px 24px 0 0; display: flex; flex-direction: column; }
.plans > div + div { padding-left: 24px; border-left: 1px solid var(--rule); }
.plans .rec { box-shadow: inset 0 3px 0 var(--signal); }
@media (max-width: 860px) { .plans { grid-template-columns: 1fr; } .plans > div, .plans > div + div { padding: 24px 0; border-left: 0; } .plans > div + div { border-top: 1px solid var(--rule); } }
.ticks li { display: flex; gap: 10px; font-size: 14px; line-height: 1.45; color: var(--ink-2); }
.ticks li + li { margin-top: 10px; }
.ticks .i { margin-top: 2px; color: var(--ink-3); }
.daybox { width: 56px; flex-shrink: 0; text-align: center; }
.daybox .d { display: block; font-stretch: 72%; font-weight: 760; font-size: 34px; line-height: 1; }
.daybox .m { font-size: 13px; color: var(--ink-3); }
.empty { padding: 40px 0; max-width: 46ch; }
.honours { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1px; background: var(--rule); border: 1px solid var(--rule); border-radius: 10px; overflow: hidden; }
.honours > div { background: var(--panel); padding: 16px 12px; display: flex; flex-direction: column; align-items: flex-start; gap: 10px; font-size: 13px; color: var(--ink-2); }
.honours > div.off { color: var(--ink-4); }

/* Overlays */
.scrim { position: fixed; inset: 0; z-index: 40; background: var(--scrim); display: flex; justify-content: center; align-items: flex-start; padding: 12vh 16px 16px; }
.sheet { width: 100%; max-width: 600px; background: var(--panel); border: 1px solid var(--rule-2); border-radius: 12px; box-shadow: 0 24px 64px rgba(0, 0, 0, .28); overflow: hidden; }
.sheet .q { display: flex; align-items: center; gap: 12px; padding: 0 18px; border-bottom: 1px solid var(--rule); }
.sheet .q input { flex: 1; height: 58px; border: 0; background: transparent; font-size: 19px; outline: none; }
.hit { display: flex; gap: 14px; align-items: flex-start; padding: 10px 12px; border-radius: 8px; }
.hit:hover, .hit:focus-visible { background: var(--hover); }
.menu { position: fixed; z-index: 30; min-width: 230px; padding: 6px; background: var(--panel); border: 1px solid var(--rule-2); border-radius: 10px; box-shadow: 0 16px 40px rgba(0, 0, 0, .22); }
.menu button { width: 100%; display: flex; align-items: center; gap: 10px; height: 36px; padding: 0 10px; border: 0; border-radius: 6px; background: transparent; font-size: 14px; text-align: left; }

const fmtDate = (d, o) => new Date(d).toLocaleDateString('en-GB', o);
const plural = (n, w) => `${n} ${w}${n === 1 ? '' : 's'}`;

function toast(msg, icon = 'check') {
  const el = document.createElement('div');
  el.className = 'toast';
  el.innerHTML = ic(icon) + `<span>${esc(msg)}</span>`;
  $('#toasts').append(el);
  setTimeout(() => el.remove(), 2600);
}

/* ---------- Router ---------- */
const state = { slide: 0, loaded: false, seasonOpen: true, machine: {}, solved: {}, billing: 'monthly', scope: 'global',
  filters: { q: '', category: '', difficulty: '', free: false }, upcomingOpen: false, track: 'All' };
let timer = null;
const machineEnds = {};

function parse() {
  const raw = location.hash.slice(1) || '/';
  const [path, qs] = raw.split('?');
  return { parts: path.split('/').filter(Boolean), query: new URLSearchParams(qs || '') };
}
const go = (h) => (location.hash = h);
function setQuery(key, val) {
  const { parts, query } = parse();
  query.set(key, val);
  history.replaceState(null, '', '#/' + parts.join('/') + '?' + query);
}
function section() {
  const p = parse().parts[0] || '';
  return { '': '/', learn: '/learn', practice: '/practice', season: '/practice', compete: '/compete' }[p] || '';
}
const NAV = [['Home', '/'], ['Learn', '/learn'], ['Practice', '/practice'], ['Compete', '/compete']];
function renderNav() {
  const s = section();
  const link = ([l, to]) => `<a href="#${to}" class="${s === to ? 'on' : ''}" ${s === to ? 'aria-current="page"' : ''}>${l}</a>`;
  $('#nav').innerHTML = NAV.map(link).join('');
  $('#bnav').innerHTML = NAV.map(link).join('');
}

function render() {
  clearInterval(timer);
  closeLayer();
  const { parts, query } = parse();
  const [a, b, c] = parts;
  let html;
  if (!a) html = home();
  else if (a === 'learn' && c) html = lesson(b, c);
  else if (a === 'learn' && b) html = pathPage(b);
  else if (a === 'learn') html = learn();
  else if (a === 'practice' && b) html = item(b);
  else if (a === 'practice') html = practice(query.get('type') || 'challenge');
  else if (a === 'season') html = season();
  else if (a === 'compete') html = compete(query.get('tab') || 'leaderboard');
  else if (a === 'profile') html = profile();
  else if (a === 'plans') html = plans();
  else if (a === 'about') html = about();
  else html = `<div class="page"><h1 class="display d-1">This page does not exist</h1><p class="lead mt-2">The link may be old. Go back to Home to find your next lesson.</p><a class="btn mt-3" href="#/">Go to Home</a></div>`;
  $('#main').innerHTML = html;
  $('#main').scrollTop = 0;
  renderNav();
  hydrateIcons();
  document.title = (document.querySelector('#main h1')?.textContent.trim() || 'Home') + ' · CSEMA concept';
  if (a === 'practice' && !b) mountPractice();
  if (a === 'practice' && b) mountClock(b);
}

function lessonStep(dir) {
  const { parts } = parse();
  if (parts[0] !== 'learn' || !parts[2]) return;
  if (dir < 0) { if (state.slide > 0) { state.slide--; render(); } return; }
  if (state.slide < SLIDES.length - 1) { state.slide++; render(); return; }
  const idx = FLAT.findIndex((l) => l.id === parts[2]);
  toast(`Lesson complete. You earned ${FLAT[idx].xp} XP.`);
  const nx = FLAT[idx + 1];
  if (nx) go(`#/learn/${parts[1]}/${nx.id}`);
}

      return;

    $('#plist').innerHTML = rows.length ? `<div class="table" role="table" aria-label="${TYPE[type].plural}">

    if (it.type === 'machine') body += `<div class="row wrap gap-3 panel" style="padding:16px 18px">
      <span class="dot ${ms === 'starting' ? 'wait' : ms === 'running' ? 'live' : ''}"></span>

          : `It runs for up to 60 minutes and uses your machine time. You have ${Math.floor(USER.machineMinutesLeft / 60)} hours left.`}</p>

      ${ms === 'off' ? `<button class="btn primary" data-act="start-machine" data-id="${id}">${ic('play', 'i-s')}Start the machine</button>`

function mountClock(id) {
  if (state.machine[id] !== 'running') return;
  const tick = () => {
    const left = Math.max(0, Math.round((machineEnds[id] - Date.now()) / 1000));
    const el = $('#clock');
    if (el) el.textContent = `${Math.floor(left / 60)}:${String(left % 60).padStart(2, '0')}`;
  };
  tick();
  timer = setInterval(tick, 1000);
}

    const q = $('#sq').value.trim().toLowerCase();

    const hit = (s) => s.toLowerCase().includes(q);
    const learnRows = [...PATHS.filter((p) => hit(p.title)).map((p) => [p.title, `Path in the ${p.track} track`, 'book-open', `#/learn/${p.id}`]),
      ...FLAT.filter((l) => hit(l.title)).map((l) => [l.title, `Lesson ${l.n} of Networking deep dive, part 1`, 'book-open', `#/learn/networking-1/${l.id}`])].slice(0, 5);
    const pr = ITEMS.filter((i) => hit(i.title) || hit(i.category)).slice(0, 6)
      .map((i) => [i.title, `${TYPE[i.type].label} in ${i.category}, ${i.difficulty.toLowerCase()}`, TYPE[i.type].icon, `#/practice/${i.id}`]);
    const groups = [['Learn', learnRows], ['Practice', pr]].filter(([, r]) => r.length);
    $('#sres').innerHTML = groups.length ? groups.map(([g, rows]) => `<p class="tiny c3" style="padding:10px 12px 4px">${g}</p>${rows.map(([t, m, i, h]) =>
      `<a class="hit" href="${h}"><span class="c3" style="margin-top:2px">${ic(i)}</span><span style="min-width:0"><span class="strong trunc" style="display:block">${esc(t)}</span><span class="small c3">${esc(m)}</span></span></a>`).join('')}`).join('')
      : `<p class="small c3" style="padding:18px 12px">Nothing matches “${esc(q)}”. Try a shorter word.</p>`;
  };
  $('#sq').oninput = draw;
  $('#sq').onkeydown = (e) => { if (e.key === 'Enter') { const a = $('#sres a'); if (a) go(a.getAttribute('href')); } };
  draw();
  $('#sq').focus();
}

/* ---------- Events ---------- */
document.addEventListener('click', (e) => {
  const t = e.target.closest('[data-act],[data-tab],[data-toast],[data-href],[data-close]');
  if (!t) return;
  if (t.dataset.close !== undefined) { if (e.target === t) closeLayer(); return; }
  if (t.dataset.href) { closeLayer(); return go(t.dataset.href); }
  if (t.dataset.toast) { closeLayer(); return toast(t.dataset.toast, t.dataset.toastIcon || 'info'); }
  if (t.dataset.tab) {
    const v = t.dataset.val, n = t.dataset.tab;
    if (n === 'type') { setQuery('type', v); state.filters.category = ''; }
    if (n === 'tab') setQuery('tab', v);
    if (n === 'track') state.track = v;
    if (n === 'scope') state.scope = v;
    if (n === 'billing') state.billing = v;
    return render();
  }
  const a = t.dataset.act;
  if (a === 'search') openSearch();
  else if (a === 'account') openAccount(t);
  else if (a === 'close') closeLayer();
  else if (a === 'prev') lessonStep(-1);
  else if (a === 'next') lessonStep(1);
  else if (a === 'toggle-upcoming') { state.upcomingOpen = !state.upcomingOpen; render(); }
  else if (a === 'toggle-chapter') { state.seasonOpen = !state.seasonOpen; render(); }
  else if (a === 'clear-filters') { state.filters = { q: '', category: '', difficulty: '', free: false }; render(); }
  else if (a === 'copy-link') { navigator.clipboard?.writeText(location.href).catch(() => {}); toast('Link copied'); }
  else if (a === 'start-machine') {
    const id = t.dataset.id;
    state.machine[id] = 'starting'; render();
    setTimeout(() => { state.machine[id] = 'running'; machineEnds[id] = Date.now() + 3600e3; if (parse().parts[1] === id) render(); toast('The machine is running'); }, 1600);
  } else if (a === 'stop-machine') { state.machine[t.dataset.id] = 'off'; render(); toast('The machine is stopped', 'info'); }
  else if (a === 'submit-flag') {
    const { id, k, xp } = t.dataset;
    const v = $('#flag-' + k).value.trim();
    if (!/^CSEMA\{.+\}$/.test(v)) return toast('A flag looks like CSEMA{...}. Check the format.', 'info');
    if (v !== 'CSEMA{demo}') return toast('That flag is not correct. Check spelling and case.', 'info');
    state.solved[id + k] = true; render(); toast(`Flag accepted. You earned ${xp} XP.`);
  } else if (a === 'join-team') joinTeam();
  else if (a === 'join-confirm') { closeLayer(); toast('Request sent to the team captain'); }
  else if (a === 'coupon') toast($('#coupon').value ? 'That code is not valid. Check it and try again.' : 'Enter a coupon code first', 'info');
});

document.addEventListener('keydown', (e) => {
  const typing = /INPUT|SELECT|TEXTAREA/.test(document.activeElement?.tagName);
  if (e.key === 'Escape' && $('#layer').innerHTML) { closeLayer(); return; }
  if (typing) return;
  if (e.key === '/' || (e.key === 'k' && (e.metaKey || e.ctrlKey))) { e.preventDefault(); openSearch(); return; }
  if ($('#layer').innerHTML) return;
  if (e.key === 'ArrowRight') lessonStep(1);
  if (e.key === 'ArrowLeft') lessonStep(-1);
});
